@if (isLoading) {
  <mat-progress-bar mode="indeterminate" color="primary" class="top-progress"></mat-progress-bar>
}

<div class="login-container">
  <mat-card class="login-card">
    <mat-card-title class="login-title">
      Geek Catalog
    </mat-card-title>

    <form (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          placeholder="Digite seu e-mail"
          [(ngModel)]="login"
          name="login"
          required
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Senha</mat-label>
        <input
          matInput
          type="password"
          placeholder="Digite sua senha"
          [(ngModel)]="password"
          name="password"
          required
        />
      </mat-form-field>

      <div class="forgot-container">
        <a class="forgot-link" href="#">Esqueceu sua senha?</a>
      </div>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          Carregando...
        } @else {
          Acessar
        }
      </button>
    </form>

    <!--
    @if (errorMessage) {
      <mat-card class="error-card mt-3">
        <mat-card-content>
          <p class="error-text">
            <mat-icon class="me-2">error</mat-icon>{{ errorMessage }}
          </p>
        </mat-card-content>
      </mat-card>
    }
    -->
  </mat-card>
</div>
