<div class="modal-container">
  <div class="modal-header">
    <h2 class="modal-title">{{ data.title }}</h2>
    <button class="modal-close" (click)="close()" aria-label="Fechar">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="modal-body">
    @if (data.body) {
      <ng-container *ngTemplateOutlet="data.body; context: { dialogRef: dialogRef }"></ng-container>
    }
  </div>

  @if (data.actions) {
    <div class="modal-actions">
      <ng-container *ngTemplateOutlet="data.actions; context: { dialogRef: dialogRef }"></ng-container>
    </div>
  }
</div>
